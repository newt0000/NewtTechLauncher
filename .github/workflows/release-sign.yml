name: Build Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build release binaries
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 / MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure CMake
        shell: msys2 {0}
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: msys2 {0}
        run: |
          cmake --build build --target NewtTechLauncher
          cmake --build build --target NewtTechInstaller

      - name: Collect release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist

          Copy-Item `
            "build\NewtTechLauncher.exe" `
            "dist\NewtTechLauncher.exe"

          Copy-Item `
            "build\NewtTechInstaller.exe" `
            "dist\NewtTechInstaller.exe"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: newttech-release-unsigned
          path: dist/*
          if-no-files-found: error